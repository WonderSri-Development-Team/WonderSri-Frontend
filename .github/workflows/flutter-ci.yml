name: Flutter CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Java (for Android builds)
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Set up Flutter with a version that includes Dart >= 3.6.1
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0' # Ensures Dart 3.6.x
          channel: 'stable'
          cache: false # Avoids using an outdated cached version

      # Verify Flutter version (for debugging)
      - name: Check Flutter version
        run: flutter --version

      # Get dependencies
      - name: Get dependencies
        run: flutter pub get

      # Build the APK
      - name: Build APK
        run: flutter build apk --release

      # Copy the APK
      - name: Copy APK to artifacts
        run: cp build/app/outputs/flutter-apk/app-release.apk /tmp/artifacts/

      # Upload as artifact (optional)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: /tmp/artifacts/app-release.apk