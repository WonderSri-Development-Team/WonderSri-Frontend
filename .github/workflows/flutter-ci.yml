name: Flutter CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Java (for Android builds)
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0' # Match your local version if different
          channel: 'stable'

      # Get dependencies
      - name: Get dependencies
        run: flutter pub get

      # (Optional) Run tests, continue even if it fails
      - name: Run Flutter tests
        run: flutter test || true
        continue-on-error: true

      # Build the APK
      - name: Build APK
        run: flutter build apk --release

      # Copy the APK to artifacts directory
      - name: Copy APK to artifacts
        run: cp build/app/outputs/flutter-apk/app-release.apk /tmp/artifacts/

      # (Optional) Upload the APK as an artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: /tmp/artifacts/app-release.apk